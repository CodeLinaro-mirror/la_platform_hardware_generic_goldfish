[env]
# The root of our bazel workspace
BAZEL_ROOT = "{{ config_root }}"

# Generates sed filters to map Bazel external repository paths back to the source tree.
BZL_SED_FILTERS = "{{ exec(command='python3 build/bazel/utils/gen_path_filters.py') }}"

ANDROID_HOME = "{% if env.ANDROID_HOME %}{{ env.ANDROID_HOME }}{% else %}$BAZEL_ROOT/prebuilts/android/android-sdk/{% if os() == 'linux' %}linux{% elif os() == 'macos' %}macosx{% else %}windows{% endif %}{% endif %}"
'_'.path = [
  "$BAZEL_ROOT/prebuilts/bazel/{% if os() == 'linux' %}linux-x86_64{% elif os() == 'macos' %}darwin-x86_64{% else %}windows-x86_64{% endif %}",
  "$BAZEL_ROOT/prebuilts/clang/host/{% if os() == 'linux' %}linux-x86{% elif os() == 'macos' %}darwin-x86{% else %}windows-x86{% endif %}/{{ exec(command='jq -r .clang build/bazel/toolchains/tool_versions.json') }}/bin",
  "$ANDROID_HOME/platform-tools/",
]

[settings]
env_shell_expand = true

[shell_alias]
# Run bazel and filter the output to make paths clickable in VS Code.
# Maps paths like 'external/goldfish+/' to 'hardware/generic/goldfish/'.
bzl = "$BAZEL_ROOT/build/bazel/utils/bzl_wrapper.sh"

[tasks.build]
description = "Builds the emulator release"
run = "bazel build @goldfish//emulator:release"

[tasks.test]
description = "Runs all the emulator tests"
run = "bazel test @goldfish//..."

[tasks.bcc]
description = "Generate the compilation database"
run = "bazel run @goldfish//development/tools:generate_bcc -- --workspace $BAZEL_ROOT"

[tasks.tidy]
description = "Generate the clang tidy report"
run = "bazel build @goldfish//:clang_tidy_report"

[tasks.submit]
description = "Upload the current branch for code review"
run = "repo upload . --cbr -y"
dir = "{{ cwd }}"

[tasks.tidy_fix]
description = "Apply fixes from the clang tidy report"
run = "bazel run @goldfish//:clang_tidy_report"

[tasks.presubmit]
description = "Upload the current branch for code review and mark it presubmit ready"
run = "repo upload . --cbr -y --label 'Presubmit-Ready+1'"
dir = "{{ cwd }}"

[tasks.gum]
description = "Update the latest commit if you are the owner"
run = "if [[ $(git show HEAD --author $USER) ]]; then git add --update .; git commit --amend ; else echo Not the owner of last commit!; fi"
dir = "{{ cwd }}"

[tasks.fastbuild]
description = "Fast C++-only verification build"
run = """
#!/usr/bin/env bash
set -euo pipefail

echo "Identifying non-C++ targets to exclude..."
RAW_EXCLUSIONS=$(bazel query "(@goldfish//...) except kind('cc_.*', @goldfish//...)" 2>/dev/null)

COUNT=$(echo "$RAW_EXCLUSIONS" | grep -c . || echo 0)
echo "Excluding $COUNT non-C++ targets from the build graph."

# Use sed to prefix each target with a '-' so Bazel subtracts it
EXCLUSIONS=$(echo "$RAW_EXCLUSIONS" | sed 's/^/-/')

# Build the whole repo (@goldfish//...) minus the excluded targets
bazel build --noshow_progress -- @goldfish//... $EXCLUSIONS
"""

[tasks.create-fasttest-exclusions]
description = "Creates the list of targets to exclude from the fasttest task"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Note: this is rather expensive to calculate dynamically,
# so we save it to a file.
bazel query  -k 'rdeps(@goldfish//..., @breakpad//:dump_syms) union rdeps(@goldfish//..., @rules_pkg//pkg/private/zip:build_zip)' | sort > hardware/generic/goldfish/development/fasttest_exclusions.txt || true
"""

[tasks.fasttest]
description = "Fast testing, that excludes zip and symbol targets"
run = """
#!/usr/bin/env bash
set -euo pipefail

EXCLUSIONS_FILE="hardware/generic/goldfish/development/fasttest_exclusions.txt"
if [[ ! -f "$EXCLUSIONS_FILE" ]]; then
    echo "Exclusions file not found: $EXCLUSIONS_FILE. Running create-fasttest-exclusions first..."
    mise run create-fasttest-exclusions
fi

RAW_EXCLUSIONS=$(cat "$EXCLUSIONS_FILE")
COUNT=$(echo "$RAW_EXCLUSIONS" | grep -c . || echo 0)
echo "Excluding $COUNT targets from the test graph."

# Use sed to prefix each target with a '-' so Bazel subtracts it
EXCLUSIONS=$(echo "$RAW_EXCLUSIONS" | sed 's/^/-/')
bazel test -- @goldfish//... $EXCLUSIONS
"""
