<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐠 Aquarium - Android Emulator SDK</title>
    <style>
      :root {
        --bg: #0a0d14;
        --surface: #111827;
        --surface-border: #1f2937;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --text: #f3f4f6;
        --text-dim: #9ca3af;
        --border: #374151;
        --success: #10b981;
        --error: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./assets/index.js"></script>
  </body>
</html>
